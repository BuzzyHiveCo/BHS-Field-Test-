<style>
*{box-sizing:border-box}:root{--bg:#f7f0df;--ink:#261b12;--brown:#21170f;--gold:#d89a00;--line:#dfcfad;--muted:#75634b;--green:#397044;--red:#9a2b23}
body{margin:0;font-family:Inter,system-ui,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit}button{cursor:pointer}
header{position:sticky;top:0;z-index:30;background:var(--brown);color:white;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
header b{font-family:Georgia,serif;font-size:21px}header small{display:block;color:#d8c8ae}
nav{display:flex;gap:6px;overflow:auto;background:#34251a;padding:8px;position:sticky;top:60px;z-index:29}
nav button{border:0;border-radius:999px;background:#4a3525;color:white;padding:9px 12px;white-space:nowrap}nav button.active{background:var(--gold);color:#21170f;font-weight:900}
main{max-width:980px;margin:auto;padding:16px 16px 90px}
.card{background:white;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 8px 20px #5a430d14}
.hero{background:linear-gradient(135deg,#21170f,#432f20);color:white;border-radius:20px;padding:22px;margin-bottom:14px}
.hero h1{font-family:Georgia,serif;margin:4px 0 8px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.12em;font-weight:900;color:#a67200}
.hero .eyebrow{color:#efc75c}.primary{background:var(--gold);border:0;border-radius:12px;padding:13px 16px;font-weight:900;color:#21170f}
.secondary{background:white;border:1px solid #cdbb9a;border-radius:10px;padding:10px 12px}.danger{color:white;background:var(--red);border:0;border-radius:10px;padding:10px 12px}
.start{width:100%;font-size:22px;padding:20px;margin:8px 0 16px;display:flex;justify-content:space-between;align-items:center}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:14px}.stat{background:white;border:1px solid var(--line);border-radius:14px;padding:13px}.stat strong{display:block;font-size:25px;color:#8a5f00}.stat span{font-size:11px;text-transform:uppercase;color:var(--muted);font-weight:800}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.yard{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.hive{border:2px solid var(--line);border-radius:13px;background:#fffaf0;padding:13px;text-align:left}.hive.Healthy{border-color:#6aa775}.hive.Monitor{border-color:#d0a02f}
h2,h3{font-family:Georgia,serif}h3{margin:0 0 10px}small,.muted{color:var(--muted)}
.progress{position:sticky;top:106px;z-index:20;background:var(--brown);color:white;border-radius:0 0 14px 14px;padding:10px 14px;margin:-16px -16px 12px;display:grid;grid-template-columns:1fr auto;gap:6px}.progress progress{grid-column:1/-1;width:100%}
.tapgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.tap{min-height:52px;border:1px solid #d3c09b;background:#fffaf0;border-radius:12px;padding:10px;font-weight:800}.tap.selected{background:#f1cb61;border-color:#9c6c00;box-shadow:0 0 0 2px #d89a0026}
.field2{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{display:grid;gap:5px;font-size:12px;font-weight:800}select,input,textarea{width:100%;padding:11px;border:1px solid #cdbb9a;border-radius:10px;background:white}textarea{min-height:110px}
.noteshead{display:flex;justify-content:space-between;align-items:center}.talk{background:#21170f;color:white;border:0;border-radius:999px;padding:11px 16px;font-weight:900}.talk.live{background:#9a2b23}
.savebar{position:sticky;bottom:0;background:#f7f0dff5;backdrop-filter:blur(6px);display:grid;grid-template-columns:1fr 2fr;gap:8px;padding:10px 0}.savebar button{padding:15px;font-weight:900;border-radius:12px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.day{min-height:145px;background:white;border:1px solid var(--line);border-radius:11px;padding:9px;text-align:left}.day.selected{border:2px solid var(--gold)}.day strong,.day span{display:block}.day span{font-size:11px;color:var(--muted)}.day small{display:block;background:#f6ecd7;border-radius:6px;padding:4px;margin-top:5px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center;border-bottom:1px solid #eee1c9;padding:10px 0}.row:last-child{border:0}
.hidden{display:none!important}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.summary div{background:#fffaf0;border-radius:12px;padding:14px}.summary b{display:block;font-size:25px}
@media(max-width:720px){.grid2{grid-template-columns:1fr}.tapgrid{grid-template-columns:repeat(2,1fr)}.field2{grid-template-columns:1fr}.week{grid-template-columns:repeat(2,1fr)}.stats,.summary{grid-template-columns:repeat(2,1fr)}}
@media(max-width:430px){.tapgrid{grid-template-columns:1fr}.savebar{grid-template-columns:1fr}}

.health-green{background:#dff1df!important;border-color:#4f915c!important;color:#1f592a!important}
.health-yellow{background:#fff2bf!important;border-color:#d09a16!important;color:#705000!important}
.health-red{background:#f9d5d1!important;border-color:#c44438!important;color:#7d211b!important}
.health-dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px}
.health-banner{border-radius:14px;padding:12px 14px;margin:10px 0 14px;font-weight:800}
.health-reason{font-size:12px;margin-top:5px;font-weight:600}

.voice-review{background:#fff7dc;border:1px solid #d89a00;border-radius:14px;padding:13px;margin-top:10px}
.voice-review h4{margin:0 0 8px;font-family:Georgia,serif}
.voice-review textarea{min-height:88px}
.voice-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.voice-actions button{padding:11px;border-radius:10px;border:1px solid #cdbb9a;font-weight:900}
.voice-state{font-size:12px;color:#6f5c43;margin-top:6px}
.voice-badge{display:inline-block;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:900;background:#f6ecd7;color:#5b4629}
@media(max-width:520px){.voice-actions{grid-template-columns:1fr}}

async function cloudWriteWithRetry(label,fn,attempts=3){
 let lastError=null;
 for(let n=1;n<=attempts;n++){
  try{const result=await fn();if(result?.error)throw result.error;return result}
  catch(e){lastError=e;if(n<attempts)await new Promise(r=>setTimeout(r,700*n))}
 }
 throw new Error(`${label} failed after ${attempts} attempts: ${lastError?.message||lastError}`);
}

function healthFromColony(c){
 const last=(state.inspections||[]).filter(i=>i.colony===c.id).slice(-1)[0];
 if(!last){
  if(c.status==='Critical'||c.status==='Needs Attention')return {level:'red',label:'Needs Attention',reason:'current colony status requires attention'};
  if(c.status==='Monitor')return {level:'yellow',label:'Monitor',reason:'colony is currently marked for monitoring'};
  return {level:'green',label:'Healthy',reason:'no current warning flags'};
 }
 const q=Array.isArray(last.queen)?last.queen:(Array.isArray(last.queenSigns)?last.queenSigns:(Array.isArray(last.queenEvidence)?last.queenEvidence:[]));
 const pop=last.population||last.overall||c.population||'', stores=last.stores||c.stores||'', brood=last.brood||c.brood||'';
 const pests=Array.isArray(last.pests)?last.pests:[];
 let red=false,yellow=false,reasons=[];
 if(q.includes('No queen evidence')){yellow=true;reasons.push('no queen evidence')}
 if(pop==='Low'||pop==='Weak'){yellow=true;reasons.push('low population')}
 if(stores==='Low'){red=true;reasons.push('low food stores')}
 if(brood==='Poor'||brood==='None'){red=true;reasons.push('poor or absent brood')}
 if(pests.includes('Varroa concern')){red=true;reasons.push('varroa concern')}
 if(pests.includes('Small hive beetles')){yellow=true;reasons.push('small hive beetles observed')}
 if(pests.includes('Wax moth')){yellow=true;reasons.push('wax moth observed')}
 if(c.status==='Critical'||c.status==='Needs Attention')red=true;
 if(red)return {level:'red',label:'Needs Attention',reason:reasons.join(', ')||'last inspection requires action'};
 if(yellow)return {level:'yellow',label:'Monitor',reason:reasons.join(', ')||'follow-up recommended'};
 return {level:'green',label:'Healthy',reason:'last inspection did not trigger a warning'};
}

let voiceDraft='',voiceRecognition=null,voiceFinal='',voiceInterim='',voiceStopping=false;
function startTalk(){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){alert('Voice-to-text is not supported in this browser. Try Chrome or Safari and allow microphone access.');return}
 voiceDraft='';voiceFinal='';voiceInterim='';voiceStopping=false;
 const r=new SR();voiceRecognition=r;r.lang='en-US';r.continuous=true;r.interimResults=true;
 r.onresult=e=>{
   voiceInterim='';
   for(let i=e.resultIndex;i<e.results.length;i++){
     const t=e.results[i][0].transcript.trim();
     if(e.results[i].isFinal){if(t)voiceFinal+=(voiceFinal?' ':'')+t}
     else voiceInterim+=(voiceInterim?' ':'')+t;
   }
   voiceDraft=(voiceFinal+(voiceInterim?' '+voiceInterim:'')).trim();
   updateLiveTranscript();
 };
 r.onerror=e=>{
   if(e.error==='no-speech'&&!voiceStopping){return}
   setTalkIdle();
   if(e.error!=='aborted')alert('Voice capture stopped. Your captured words are still available to review.');
   if(voiceDraft)showVoiceReview();
 };
 r.onend=()=>{
   setTalkIdle();
   if(voiceDraft)showVoiceReview();
 };
 r.start();
 const b=document.querySelector('#talk');if(b){b.classList.add('live');b.textContent='■ STOP TALKING'}

 const live=document.querySelector('#liveTranscript');if(live){live.classList.remove('hidden');live.value=''}
}

function nucProgram(){
 const planned=nucRecords.filter(n=>n.status==='Planned').length,reserved=nucRecords.filter(n=>n.status==='Reserved').length,ready=nucRecords.filter(n=>n.status==='Ready').length,sold=nucRecords.filter(n=>n.status==='Sold').length;
 const opts=(arr,val)=>arr.map(x=>`<option ${val===x?'selected':''}>${x}</option>`).join('');
 app.innerHTML=`<div class="hero"><div class="eyebrow">Spring 2027 Pilot</div><h1>Nuc Program</h1><p>10 planned sale nucs at $185 each. Track genetics, production dates, quality release, customer, and pickup history.</p></div>
 <div class="stats"><div class="stat"><strong>${nucRecords.length}</strong><span>Total records</span></div><div class="stat"><strong>${planned}</strong><span>Planned</span></div><div class="stat"><strong>${reserved}</strong><span>Reserved</span></div><div class="stat"><strong>${ready+sold}</strong><span>Ready / Sold</span></div></div>
 <div class="card"><h3>Buzzy Hive Nuc Standard · 2027 v1</h3><p>5 deep drawn frames · bees, brood and food stores · new marked laying queen · mite management · small hive beetle control.</p><p class="muted"><b>Release rule:</b> A reservation never overrides quality. Every nuc must receive a final PASS before pickup.</p></div>
 ${nucRecords.map(n=>{const k=n.id;return `<details class="card" ${n.status!=='Planned'?'open':''}><summary style="cursor:pointer;font-weight:900;font-size:17px">${esc(n.nuc_code)} · ${esc(n.status)} · $${Number(n.sale_price||0).toFixed(0)}</summary><div class="field2" style="margin-top:14px">
 <label>Status<select id="nuc-status-${k}">${opts(['Planned','Building','Queen Cell','Mating','Laying','Reserved','Ready','Sold','Hold'],n.status)}</select></label>
 <label>Purpose<select id="nuc-purpose-${k}">${opts(['Sale','Keep / Expansion','Replacement'],n.purpose)}</select></label>
 <label>Breeder line<input id="nuc-breeder-${k}" value="${esc(n.breeder_line||'')}" placeholder="Example: H-004 / Breeder 1"></label>
 <label>Source colonies<input id="nuc-source-${k}" value="${esc(n.source_colonies||'')}" placeholder="Example: H-001, H-005"></label>
 <label>Nuc created<input id="nuc-created-${k}" type="date" value="${n.created_date||''}"></label>
 <label>Queen cell date<input id="nuc-cell-${k}" type="date" value="${n.queen_cell_date||''}"></label>
 <label>Laying confirmed<input id="nuc-laying-${k}" type="date" value="${n.laying_confirmed_date||''}"></label>
 <label>Final inspection<select id="nuc-final-${k}">${opts(['Pending','PASS','HOLD'],n.final_inspection)}</select></label>
 <label>Customer<input id="nuc-customer-${k}" value="${esc(n.customer_name||'')}" placeholder="Customer name"></label>
 <label>Sale price<input id="nuc-price-${k}" type="number" min="0" step="1" value="${Number(n.sale_price||185)}"></label>
 <label>Pickup date<input id="nuc-pickup-${k}" type="date" value="${n.pickup_date||''}"></label>
 </div><label style="margin-top:10px">History / notes<textarea id="nuc-notes-${k}" placeholder="Queen development, customer notes, quality observations...">${esc(n.notes||'')}</textarea></label>
 <div style="display:flex;align-items:center;gap:10px;margin-top:12px"><button id="nuc-save-${k}" class="primary" onclick="saveNucRecord('${k}')">SAVE NUC RECORD</button><span id="nuc-save-state-${k}" class="muted"></span></div></details>`}).join('')||'<div class="card"><p class="muted">No nuc records loaded.</p></div>'}`;
}
async function saveNucRecord(id){
 const g=s=>document.getElementById(s+'-'+id),btn=g('nuc-save'),msg=g('nuc-save-state');
 const payload={status:g('nuc-status').value,purpose:g('nuc-purpose').value,breeder_line:g('nuc-breeder').value.trim()||null,source_colonies:g('nuc-source').value.trim()||null,created_date:g('nuc-created').value||null,queen_cell_date:g('nuc-cell').value||null,laying_confirmed_date:g('nuc-laying').value||null,final_inspection:g('nuc-final').value,customer_name:g('nuc-customer').value.trim()||null,sale_price:Number(g('nuc-price').value||0),pickup_date:g('nuc-pickup').value||null,notes:g('nuc-notes').value.trim()||null,updated_at:new Date().toISOString()};
 const old=btn.textContent;btn.disabled=true;btn.textContent='SAVING…';msg.textContent='Saving to cloud…';
 try{await cloudWriteWithRetry('Nuc record save',()=>sb.from('nuc_records_test_065').update(payload).eq('id',id));btn.textContent='SAVED ✓';msg.textContent='Cloud save confirmed.';await loadNucProgram();setTimeout(()=>{if(document.getElementById('nuc-save-'+id)){document.getElementById('nuc-save-'+id).disabled=false;document.getElementById('nuc-save-'+id).textContent='SAVE NUC RECORD';const m=document.getElementById('nuc-save-state-'+id);if(m)m.textContent=''}},1400)}
 catch(e){btn.disabled=false;btn.textContent=old;msg.textContent='Not saved.';alert(e.message+'\\nYour entries are still on screen. Check your connection and tap Save again.')}
}

function importBackup(file){
 if(!file)return;
 const r=new FileReader();
 r.onload=()=>{try{const p=JSON.parse(r.result),incoming=p.state||p.data||p;if(!incoming||!Array.isArray(incoming.colonies))throw new Error('No colony data found');if(!confirm(`Import ${incoming.colonies.length} colony records?`))return;state=incoming;state.operations=state.operations||[];save();render();alert('Backup imported successfully.')}catch(e){alert('Could not import backup: '+e.message)}};
 r.readAsText(file);
}
function exportBackup(){const blob=new Blob([JSON.stringify({app:'BHS Field Test',version:'0.5.1',exportedAt:new Date().toISOString(),state},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='bhs-field-test-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
initCloud();
</script>
