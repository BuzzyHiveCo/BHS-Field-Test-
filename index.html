<title>Buzzy Hive Field Test 0.5.5</title>
<style>
*{box-sizing:border-box}:root{--bg:#f7f0df;--ink:#261b12;--brown:#21170f;--gold:#d89a00;--line:#dfcfad;--muted:#75634b;--green:#397044;--red:#9a2b23}
body{margin:0;font-family:Inter,system-ui,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit}button{cursor:pointer}
header{position:sticky;top:0;z-index:30;background:var(--brown);color:white;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
header b{font-family:Georgia,serif;font-size:21px}header small{display:block;color:#d8c8ae}
nav{display:flex;gap:6px;overflow:auto;background:#34251a;padding:8px;position:sticky;top:60px;z-index:29}
nav button{border:0;border-radius:999px;background:#4a3525;color:white;padding:9px 12px;white-space:nowrap}nav button.active{background:var(--gold);color:#21170f;font-weight:900}
main{max-width:980px;margin:auto;padding:16px 16px 90px}
.card{background:white;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 8px 20px #5a430d14}
.hero{background:linear-gradient(135deg,#21170f,#432f20);color:white;border-radius:20px;padding:22px;margin-bottom:14px}
.hero h1{font-family:Georgia,serif;margin:4px 0 8px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.12em;font-weight:900;color:#a67200}
.hero .eyebrow{color:#efc75c}.primary{background:var(--gold);border:0;border-radius:12px;padding:13px 16px;font-weight:900;color:#21170f}
.secondary{background:white;border:1px solid #cdbb9a;border-radius:10px;padding:10px 12px}.danger{color:white;background:var(--red);border:0;border-radius:10px;padding:10px 12px}
.start{width:100%;font-size:22px;padding:20px;margin:8px 0 16px;display:flex;justify-content:space-between;align-items:center}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:14px}.stat{background:white;border:1px solid var(--line);border-radius:14px;padding:13px}.stat strong{display:block;font-size:25px;color:#8a5f00}.stat span{font-size:11px;text-transform:uppercase;color:var(--muted);font-weight:800}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.yard{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.hive{border:2px solid var(--line);border-radius:13px;background:#fffaf0;padding:13px;text-align:left}.hive.Healthy{border-color:#6aa775}.hive.Monitor{border-color:#d0a02f}
h2,h3{font-family:Georgia,serif}h3{margin:0 0 10px}small,.muted{color:var(--muted)}
.progress{position:sticky;top:106px;z-index:20;background:var(--brown);color:white;border-radius:0 0 14px 14px;padding:10px 14px;margin:-16px -16px 12px;display:grid;grid-template-columns:1fr auto;gap:6px}.progress progress{grid-column:1/-1;width:100%}
.tapgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.tap{min-height:52px;border:1px solid #d3c09b;background:#fffaf0;border-radius:12px;padding:10px;font-weight:800}.tap.selected{background:#f1cb61;border-color:#9c6c00;box-shadow:0 0 0 2px #d89a0026}
.field2{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{display:grid;gap:5px;font-size:12px;font-weight:800}select,input,textarea{width:100%;padding:11px;border:1px solid #cdbb9a;border-radius:10px;background:white}textarea{min-height:110px}
.noteshead{display:flex;justify-content:space-between;align-items:center}.talk{background:#21170f;color:white;border:0;border-radius:999px;padding:11px 16px;font-weight:900}.talk.live{background:#9a2b23}
.savebar{position:sticky;bottom:0;background:#f7f0dff5;backdrop-filter:blur(6px);display:grid;grid-template-columns:1fr 2fr;gap:8px;padding:10px 0}.savebar button{padding:15px;font-weight:900;border-radius:12px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.day{min-height:145px;background:white;border:1px solid var(--line);border-radius:11px;padding:9px;text-align:left}.day.selected{border:2px solid var(--gold)}.day strong,.day span{display:block}.day span{font-size:11px;color:var(--muted)}.day small{display:block;background:#f6ecd7;border-radius:6px;padding:4px;margin-top:5px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center;border-bottom:1px solid #eee1c9;padding:10px 0}.row:last-child{border:0}
.hidden{display:none!important}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.summary div{background:#fffaf0;border-radius:12px;padding:14px}.summary b{display:block;font-size:25px}
@media(max-width:720px){.grid2{grid-template-columns:1fr}.tapgrid{grid-template-columns:repeat(2,1fr)}.field2{grid-template-columns:1fr}.week{grid-template-columns:repeat(2,1fr)}.stats,.summary{grid-template-columns:repeat(2,1fr)}}
@media(max-width:430px){.tapgrid{grid-template-columns:1fr}.savebar{grid-template-columns:1fr}}

.health-green{background:#dff1df!important;border-color:#4f915c!important;color:#1f592a!important}
.health-yellow{background:#fff2bf!important;border-color:#d09a16!important;color:#705000!important}
.health-red{background:#f9d5d1!important;border-color:#c44438!important;color:#7d211b!important}
.health-dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px}
.health-banner{border-radius:14px;padding:12px 14px;margin:10px 0 14px;font-weight:800}
.health-reason{font-size:12px;margin-top:5px;font-weight:600}

.voice-review{background:#fff7dc;border:1px solid #d89a00;border-radius:14px;padding:13px;margin-top:10px}
.voice-review h4{margin:0 0 8px;font-family:Georgia,serif}
.voice-review textarea{min-height:88px}
.voice-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.voice-actions button{padding:11px;border-radius:10px;border:1px solid #cdbb9a;font-weight:900}
.voice-state{font-size:12px;color:#6f5c43;margin-top:6px}
.voice-badge{display:inline-block;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:900;background:#f6ecd7;color:#5b4629}
@media(max-width:520px){.voice-actions{grid-template-columns:1fr}}
</style>

function healthFromColony(c){
 const last=(state.inspections||[]).filter(i=>i.colony===c.id).slice(-1)[0];
 if(!last){
  if(c.status==='Critical'||c.status==='Needs Attention')return {level:'red',label:'Needs Attention',reason:'current colony status requires attention'};
  if(c.status==='Monitor')return {level:'yellow',label:'Monitor',reason:'colony is currently marked for monitoring'};
  return {level:'green',label:'Healthy',reason:'no current warning flags'};
 }
 const q=Array.isArray(last.queen)?last.queen:(Array.isArray(last.queenSigns)?last.queenSigns:(Array.isArray(last.queenEvidence)?last.queenEvidence:[]));
 const pop=last.population||last.overall||c.population||'', stores=last.stores||c.stores||'', brood=last.brood||c.brood||'';
 const pests=Array.isArray(last.pests)?last.pests:[];
 let red=false,yellow=false,reasons=[];
 if(q.includes('No queen evidence')){yellow=true;reasons.push('no queen evidence')}
 if(pop==='Low'||pop==='Weak'){yellow=true;reasons.push('low population')}
 if(stores==='Low'){red=true;reasons.push('low food stores')}
 if(brood==='Poor'||brood==='None'){red=true;reasons.push('poor or absent brood')}
 if(pests.includes('Varroa concern')){red=true;reasons.push('varroa concern')}
 if(pests.includes('Small hive beetles')){yellow=true;reasons.push('small hive beetles observed')}
 if(pests.includes('Wax moth')){yellow=true;reasons.push('wax moth observed')}
 if(c.status==='Critical'||c.status==='Needs Attention')red=true;
 if(red)return {level:'red',label:'Needs Attention',reason:reasons.join(', ')||'last inspection requires action'};
 if(yellow)return {level:'yellow',label:'Monitor',reason:reasons.join(', ')||'follow-up recommended'};
 return {level:'green',label:'Healthy',reason:'last inspection did not trigger a warning'};
}
function healthClass(c){return 'health-'+healthFromColony(c).level}
function healthDot(c){const l=healthFromColony(c).level;const color=l==='green'?'#4f915c':l==='yellow'?'#d09a16':'#c44438';return `<span class="health-dot" style="background:${color}"></span>`}

function toggle(field,val){const a=session.draft[field];session.draft[field]=a.includes(val)?a.filter(x=>x!==val):[...a,val];render()}
function choose(field,val){session.draft[field]=val;render()}
let voiceDraft='',voiceRecognition=null,voiceFinal='',voiceInterim='',voiceStopping=false;
function startTalk(){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){alert('Voice-to-text is not supported in this browser. Try Chrome or Safari and allow microphone access.');return}
 voiceDraft='';voiceFinal='';voiceInterim='';voiceStopping=false;
 const r=new SR();voiceRecognition=r;r.lang='en-US';r.continuous=true;r.interimResults=true;
 r.onresult=e=>{
   voiceInterim='';
   for(let i=e.resultIndex;i<e.results.length;i++){
     const t=e.results[i][0].transcript.trim();
     if(e.results[i].isFinal){if(t)voiceFinal+=(voiceFinal?' ':'')+t}
     else voiceInterim+=(voiceInterim?' ':'')+t;
   }
   voiceDraft=(voiceFinal+(voiceInterim?' '+voiceInterim:'')).trim();
   updateLiveTranscript();
 };
 r.onerror=e=>{
   if(e.error==='no-speech'&&!voiceStopping){return}
   setTalkIdle();
   if(e.error!=='aborted')alert('Voice capture stopped. Your captured words are still available to review.');
   if(voiceDraft)showVoiceReview();
 };
 r.onend=()=>{
   setTalkIdle();
   if(voiceDraft)showVoiceReview();
 };
 r.start();
 const b=document.querySelector('#talk');if(b){b.classList.add('live');b.textContent='■ STOP TALKING'}
 const s=document.querySelector('#voiceState');if(s)s.textContent='Listening continuously… describe the hive naturally, then tap STOP TALKING.';
 const live=document.querySelector('#liveTranscript');if(live){live.classList.remove('hidden');live.value=''}
}

 voiceStopping=true;
 try{voiceRecognition?.stop()}catch(e){}
 const s=document.querySelector('#voiceState');if(s)s.textContent='Stopping… preparing your full transcript.';
}

 const live=document.querySelector('#liveTranscript');
 if(live)live.value=voiceDraft;
}

 const d=session.draft;if(!d.queen.length||!d.population||!d.stores||!d.brood){alert('Select queen signs, population, food stores, and brood before saving.');return}

 const follow=red||yellow;

 const c=state.colonies.find(c=>c.id===d.colony);if(c){c.status=red?'Needs Attention':yellow?'Monitor':'Healthy';c.population=d.population;c.stores=d.stores;c.brood=d.brood;c.lastInspection=d.date;c.queenEvidence=d.queen.join(', ');c.shb=d.pests.includes('Small hive beetles')?'Observed':'None seen'}
 (state.timeline[d.colony]??=[]).push({date:d.date,text:`Routine inspection • Queen: ${d.queen.join(', ')} • Population: ${d.population} • Stores: ${d.stores} • Brood: ${d.brood}${d.pests.length?' • Pests: '+d.pests.join(', '):''}`})
 if(d.syrup!=='None')state.operations.push({id:uid('OP'),type:'Feeding',colony:d.colony,date:d.date,detail:d.syrup+' syrup'})
 if(d.pollen!=='None')state.operations.push({id:uid('OP'),type:'Pollen',colony:d.colony,date:d.date,detail:d.pollen+' pollen patty'})
 if(d.treatment!=='None')state.operations.push({id:uid('OP'),type:'Treatment',colony:d.colony,date:d.date,detail:d.treatment+(d.treatmentNotes?' — '+d.treatmentNotes:'')})
 session.results.push(rec);save();
 const cs=activeColonies();if(session.index>=cs.length-1){session.finished=true;render();return}session.index++;session.draft=blank(cs[session.index].id);scrollTo(0,0);render()
}
function inspection(){
 if(session.finished){const rs=session.results;app.innerHTML=`<div class="card"><div class="eyebrow">Inspection complete</div><h2>${rs.length} colonies inspected</h2><div class="summary"><div><b>${rs.filter(r=>r.syrup!=='None').length}</b><span>Fed</span></div><div><b>${rs.filter(r=>r.pollen!=='None').length}</b><span>Pollen added</span></div><div><b>${rs.filter(r=>r.treatment!=='None').length}</b><span>Treated</span></div><div><b>${rs.filter(r=>r.needsFollowup).length}</b><span>Follow-up</span></div></div><button class="primary start" onclick="session=null;setView('home')">Return to Command Center</button></div>`;return}
 const cs=activeColonies(),c=cs[session.index],d=session.draft;
 const q=['Eggs','Young larvae','Capped brood','Queen seen','Queen cells','No queen evidence'],pop=['Low','Average','Strong','Crowded'],stores=['Low','Adequate','Heavy'],brood=['Full / clean','Acceptable','Spotty','Poor','None'],pests=['Small hive beetles','Varroa concern','Wax moth','Other pest'];
 const taps=(arr,field,multi=false)=>`<div class="tapgrid">${arr.map(v=>`<button class="tap ${multi?d[field].includes(v):d[field]===v?'selected':''} ${multi&&d[field].includes(v)?'selected':''}" onclick="${multi?`toggle('${field}','${v}')`:`choose('${field}','${v}')`}">${v}</button>`).join('')}</div>`;
 app.innerHTML=`<div class="progress"><b>${c.id}</b><span>Hive ${session.index+1} of ${cs.length}</span><progress value="${session.index+1}" max="${cs.length}"></progress></div>
 <div class="card"><h3>Queen signs <small>Select all that apply</small></h3>${taps(q,'queen',true)}</div>
 <div class="card"><h3>Population</h3>${taps(pop,'population')}</div>
 <div class="card"><h3>Food stores</h3>${taps(stores,'stores')}</div>
 <div class="card"><h3>Brood pattern</h3>${taps(brood,'brood')}</div>
 <div class="card"><h3>Pests</h3>${taps(pests,'pests',true)}<button class="secondary" style="margin-top:8px" onclick="session.draft.pests=[];render()">None seen</button></div>
 <div class="card"><h3>Feeding & pollen</h3><div class="field2"><label>Syrup added<select onchange="choose('syrup',this.value)">${['None','1/4 gal','1/2 gal','3/4 gal','1 gal','Other'].map(x=>`<option ${d.syrup===x?'selected':''}>${x}</option>`).join('')}</select></label><label>Pollen patty added<select onchange="choose('pollen',this.value)">${['None','1/4 patty','1/2 patty','1 patty','Other'].map(x=>`<option ${d.pollen===x?'selected':''}>${x}</option>`).join('')}</select></label></div></div>
 <div class="card"><h3>Treatment</h3><div class="field2"><label>Treatment<select onchange="choose('treatment',this.value)">${['None','Apivar','Formic Pro','Oxalic acid','Other'].map(x=>`<option ${d.treatment===x?'selected':''}>${x}</option>`).join('')}</select></label><label>Notes<input value="${esc(d.treatmentNotes)}" onchange="session.draft.treatmentNotes=this.value" placeholder="Dose / strips / removal date"></label></div></div>
 <div class="card"><h3>Intervention</h3><select onchange="choose('intervention',this.value)">${['None','Added super','Removed super','Queen work','Equalized colony','Equipment change','Other'].map(x=>`<option ${d.intervention===x?'selected':''}>${x}</option>`).join('')}</select></div>
 <div class="card"><div class="noteshead"><h3>Notes</h3><button id="talk" class="talk" onclick="this.classList.contains('live')?stopTalk():startTalk()">🎤 START TALKING</button></div><textarea id="notes" placeholder="Talk or type only what matters...">${esc(d.notes)}</textarea><div id="voiceState" class="voice-state">Tap START TALKING and describe the hive naturally. Tap STOP TALKING when finished.</div><textarea id="liveTranscript" class="hidden" readonly placeholder="Live transcription appears here while you speak..."></textarea><div id="voiceReview" class="voice-review hidden"><span class="voice-badge">Transcript Preview</span><h4>Review before adding</h4><textarea id="voicePreview" placeholder="Transcript appears here..."></textarea><div class="voice-actions"><button class="primary" onclick="useVoiceNote()">USE NOTE</button><button class="secondary" onclick="retryVoiceNote()">RETRY</button><button class="secondary" onclick="clearVoicePreview()">CLEAR</button></div></div><small>Speak as long as needed. The full transcript is only added after you review and approve it.</small></div>
 <div class="savebar"><button class="secondary" onclick="session=null;setView('home')">Exit</button><button class="primary" onclick="saveNext()">${session.index===cs.length-1?'Finish Inspection':'Save & Next Hive →'}</button></div>`;
}
function colonies(){app.innerHTML=`<div class="hero"><div class="eyebrow">Living colonies</div><h1>Home Yard</h1></div>${activeColonies().map(c=>`<button class="card ${healthClass(c)}" style="width:100%;text-align:left" onclick="openColony('${c.id}')"><div class="row"><div><b>${healthDot(c)}${c.id}</b><small>Queen ${esc(c.queen)} · Last inspection ${esc(c.lastInspection||'None')}</small></div><b>${esc(healthFromColony(c).label)}</b></div></button>`).join('')}`}
function openColony(id){const c=state.colonies.find(x=>x.id===id),ins=state.inspections.filter(i=>i.colony===id).slice().reverse();app.innerHTML=`<button class="secondary" onclick="colonies()">← Back</button><div class="hero"><div class="eyebrow">Living Colony</div><h1>${c.id}</h1><p>Population ${c.population} · Queen ${c.queen}</p></div><div class="health-banner ${healthClass(c)}">${healthDot(c)}${esc(healthFromColony(c).label)}<div class="health-reason">Why: ${esc(healthFromColony(c).reason)}</div></div><button class="primary" style="width:100%;margin-bottom:12px" onclick="quickSelected=['${c.id}'];startSelectedQuick()">QUICK CHECK ${c.id}</button><div class="card"><h3>Queen evidence</h3><p>${esc(c.queenEvidence||'Not recorded')}</p></div><div class="card"><h3>Inspection history</h3>${ins.map(i=>`<div class="row"><div><b>${esc(i.date)} · ${esc(i.type)}</b><small>${esc(i.notes||i.overall||'')}</small></div></div>`).join('')||'<p class="muted">No inspections.</p>'}</div>`}
function calendar(){
 const days=Array.from({length:7},(_,i)=>{const d=new Date(weekStart);d.setDate(d.getDate()+i);return d});
 app.innerHTML=`<div class="hero"><div class="eyebrow">Weekly planning</div><h1>Calendar</h1><div class="field2"><button class="secondary" onclick="weekStart=new Date(weekStart);weekStart.setDate(weekStart.getDate()-7);render()">← Previous</button><button class="secondary" onclick="weekStart=new Date(weekStart);weekStart.setDate(weekStart.getDate()+7);render()">Next →</button></div></div>
 <div class="week">${days.map(d=>{const date=iso(d),ts=state.tasks.filter(t=>t.due===date);return `<button class="day ${selectedDay===date?'selected':''}" onclick="selectedDay='${date}';render()"><strong>${d.toLocaleDateString('en-US',{weekday:'short'})}</strong><span>${d.toLocaleDateString('en-US',{month:'short',day:'numeric'})}</span>${ts.slice(0,4).map(t=>`<small>${esc(t.title)}${t.colony?' · '+t.colony:''}</small>`).join('')}</button>`}).join('')}</div>
 <div class="card"><h3>Add task to ${selectedDay}</h3><div class="field2"><label>Task<input id="taskTitle" placeholder="Inspect feeder, remove treatment..."></label><label>Colony<select id="taskColony"><option value="">Whole yard / operations</option>${activeColonies().map(c=>`<option>${c.id}</option>`).join('')}</select></label></div><button class="primary" style="margin-top:10px" onclick="addTask()">Add to calendar</button></div>
 <div class="card"><h3>Tasks for ${selectedDay}</h3>${state.tasks.filter(t=>t.due===selectedDay).map(t=>`<div class="row"><div><b>${esc(t.title)}</b><small>${esc(t.colony||'Operations')}</small></div><button class="secondary" onclick="toggleTask('${t.id}')">${t.done?'Reopen':'Complete'}</button></div>`).join('')||'<p class="muted">No tasks.</p>'}</div>`;
}
function addTask(){const title=document.querySelector('#taskTitle').value.trim();if(!title)return;state.tasks.push({id:uid('T'),title,colony:document.querySelector('#taskColony').value,apiary:'Home Yard',priority:'normal',due:selectedDay,done:false,reason:''});save();render()}
function toggleTask(id){const t=state.tasks.find(x=>x.id===id);if(t)t.done=!t.done;save();render()}
function operations(){
 app.innerHTML=`<div class="hero"><div class="eyebrow">Inputs & treatments</div><h1>Feeding, Pollen & Treatments</h1></div>
 <div class="card"><div class="field2"><label>Type<select id="opType"><option>Feeding</option><option>Pollen</option><option>Treatment</option></select></label><label>Colony<select id="opColony">${activeColonies().map(c=>`<option>${c.id}</option>`).join('')}</select></label><label>Date<input id="opDate" type="date" value="${today()}"></label><label>Amount / treatment / notes<input id="opDetail" placeholder="3/4 gal 1:1 syrup, 1/4 patty, Apivar..."></label></div><button class="primary" style="margin-top:10px" onclick="addOp()">Add record</button></div>
 <div class="card"><h3>Recent records</h3>${state.operations.slice().reverse().map(r=>`<div class="row"><div><b>${esc(r.date)} · ${esc(r.colony)} · ${esc(r.type)}</b><small>${esc(r.detail)}</small></div></div>`).join('')||'<p class="muted">No records yet.</p>'}</div>`;
}
function addOp(){const detail=document.querySelector('#opDetail').value.trim();if(!detail)return;state.operations.push({id:uid('OP'),type:opType.value,colony:opColony.value,date:opDate.value,detail});save();render()}
function inventory(){app.innerHTML=`<div class="hero"><div class="eyebrow">Operations</div><h1>Inventory</h1><p>Quantities remain at zero until supplies are ordered.</p></div>${state.inventory.map(i=>`<div class="card"><div class="row"><div><b>${esc(i.name)}</b><small>Reorder at ${i.reorderPoint} ${esc(i.unit)} · Lead time ${i.leadDays} days</small></div><input style="width:100px" type="number" min="0" value="${i.quantity}" onchange="setInv('${i.id}',this.value)"></div></div>`).join('')}`}
function setInv(id,v){const i=state.inventory.find(x=>x.id===id);if(i)i.quantity=Number(v);save()}

function importBackup(file){
 if(!file)return;
 const r=new FileReader();
 r.onload=()=>{try{const p=JSON.parse(r.result),incoming=p.state||p.data||p;if(!incoming||!Array.isArray(incoming.colonies))throw new Error('No colony data found');if(!confirm(`Import ${incoming.colonies.length} colony records?`))return;state=incoming;state.operations=state.operations||[];save();render();alert('Backup imported successfully.')}catch(e){alert('Could not import backup: '+e.message)}};
 r.readAsText(file);
}
function exportBackup(){const blob=new Blob([JSON.stringify({app:'BHS Field Test',version:'0.5.1',exportedAt:new Date().toISOString(),state},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='bhs-field-test-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
render();
</script>
</body>
</html>
